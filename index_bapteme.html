<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baptême</title>
    <link rel="stylesheet" href="./css/style_index.css">
    <link rel="stylesheet" href="./css/style_bapteme.css">
    <link rel="stylesheet" href="./css/style_backbutton.css">
    <link rel="stylesheet" href="./css/style_iframe.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Bouton admin -->
    <div id="admin-access">
        <button id="btn-admin">🔒 Admin</button>
    </div>

    <div class="container">
        <div class="item">
            <a class="iframe-link" href="https://www.zoom.com/fr" data-module="facetime" id="option">
                <div class="icon">
                    <img src="img/facetime.png" alt="video-chat">
                    <h3>APPEL VIDÉO</h3>
                </div>
            </a>
        </div>
        <a class="iframe-link" href="https://vocalvideo.com/" data-module="livreor" id="option">
            <div class="icon">
                <img src="img/livreor.png" alt="Livre d'or">
                <h3>LIVRE D'OR VIDÉO</h3>
            </div>
        </a>
        <a class="iframe-link" href="https://www.simplebooth.com/" data-module="photo" id="option">
            <div class="icon">
                <img src="img/photobooth-ia.jpg" alt="Photobooth">
                <!-- <h3>PHOTOBOOTH</h3> -->
            </div>
        </a>
        <div class="item">
            <a class="iframe-link" href="https://www.loom.com/" data-module="video" id="option">
                <div class="icon">
                    <img src="img/videobooth-ia.jpg" alt="Videobooth">
                    <!-- <h3>VIDEOBOOTH</h3> -->
                </div>
            </a>

        </div>
    </div>

    <!-- iframe fullscreen -->
    <iframe id="fullscreen-iframe" sandbox="allow-scripts allow-same-origin"></iframe>

    <!-- bouton fermer iframe -->
    <button id="close-iframe-btn">✕ Fermer</button>


    <script src="./js/scriptGrey.js"></script>
    <script src="./js/scriptBackButton.js"></script>
    <script src="./js/scriptIframe.js"></script>
</body>

</html>
