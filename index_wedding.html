<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariage</title>
    <link rel="stylesheet" href=".//css/style_index.css">
    <link rel="stylesheet" href="./css/style_wedding.css">
    <link rel="stylesheet" href="./css/style_backbutton.css">
    <link rel="stylesheet" href="./css/style_iframe.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Bouton retour -->
    <a class="back-button" href="index.html" id="backbutton">
        Retour
    </a>

    <!-- Bouton admin -->
    <div id="admin-access">
        <button id="btn-admin">🔒 Admin</button>
    </div>

    <div class="container">
        <div class="item" style="grid-area: tl;">
            <a href="https://vocalvideo.com/" id="option" class="icon iframe-link">
                <img src="./img/livreor.png" alt="Livre d'or">
                <h3>LIVRE D'OR VIDÉO</h3>
            </a>
        </div>
        <div class="item" style="grid-area: tr;">
            <a href="https://www.simplebooth.com/" id="option" class="icon iframe-link">
                <img src="./img/photo.png" alt="Photobooth">
                <h3>PHOTOBOOTH</h3>
            </a>
        </div>
        <div class="item" style="grid-area: c;">
            <a href="https://www.loom.com/" id="option" class="icon iframe-link">
                <img src="./img/video.png" alt="Videobooth">
                <h3>VIDEOBOOTH</h3>
            </a>
        </div>
        <div class="item" style="grid-area: bl;">
            <a href="#" id="option" class="icon iframe-link">
                <img src="./img/facetime.png" alt="Facetime">
                <h3>APPEL VIDÉO</h3>
            </a>
        </div>
        <div class="item" style="grid-area: br;">
            <a href="https://www.karafun.fr/" id="option" class="icon iframe-link">
                <img src="./img/karaoke.png" alt="Karaoke">
                <h3>KARAOKE</h3>
            </a>
        </div>
    </div>

    <!-- iframe fullscreen -->
    <iframe id="fullscreen-iframe" sandbox="allow-scripts allow-same-origin"></iframe>

    <!-- bouton fermer iframe -->
    <button id="close-iframe-btn">✕ Fermer</button>


    <script src="./js/scriptBackButton.js"></script>
    <script src="./js/scriptIframe.js"></script>
</body>

</html>
