<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entreprise</title>
    <link rel="stylesheet" href="./css/style_company.css">
    <link rel="stylesheet" href="./css/style_iframe.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Bouton admin -->
    <div id="admin-access">
        <button id="btn-admin">🔒 Admin</button>
    </div>

    <div class="container">
        <div class="item">
            <a class="iframe-link" href="https://www.slido.com/fr" data-module="feedback" id="option">
                <div class="icon">
                    <img src="img/feedback.png" alt="Feedback">
                    <h3>FEEDBACK</h3>
                </div>
            </a>
        </div>
        <div class="item">
            <a class="iframe-link" href="https://www.karafun.fr/" data-module="karaoke" id="option">
                <div class="icon">
                    <img src="img/karaoke-ia.jpg" alt="karaoke">
                    <!-- <h3>KARAOKE</h3> -->
                </div>
            </a>
        </div>
        <div class="item">
            <a class="iframe-link" href="https://www.simplebooth.com/" data-module="photo" id="option">
                <div class="icon">
                    <img src="img/photobooth-ia.jpg" alt="photo">
                    <!-- <h3>PHOTOBOOTH</h3> -->
                </div>
            </a>
        </div>
        <div class="item">
            <a class="iframe-link" href="https://www.loom.com/" data-module="video" id="option">
                <div class="icon">
                    <img src="img/videobooth-ia.jpg" alt="video">
                    <!-- <h3>VIDEOBOOTH</h3> -->
                </div>
            </a>
        </div>
        <div class="item">
            <a class="iframe-link" href="#" data-module="tombola" id="option">
                <div class="icon">
                    <img src="img/tombola.png" alt="tombola">
                    <h3>JEU INTERACTIF</h3>
                </div>
            </a>
        </div>
    </div>

    <!-- iframe fullscreen -->
    <iframe id="fullscreen-iframe" sandbox="allow-scripts allow-same-origin"></iframe>

    <!-- bouton fermer iframe -->
    <button id="close-iframe-btn">✕ Fermer</button>

    <script src="./js/scriptGrey.js"></script>
    <script src="./js/scriptBackButton.js"></script>
    <script src="./js/scriptIframe.js"></script>
</body>

</html>
